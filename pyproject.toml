[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sql-data-analyst"
version = "0.1.0"
description = "Secure natural-language-to-SQL analytics and visualization platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    { name = "Cristiano Pereira" }
]
keywords = [
    "analytics",
    "artificial-intelligence",
    "fastapi",
    "natural-language-to-sql",
    "nl2sql",
    "postgresql",
    "streamlit",
    "text-to-sql",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pandas>=2.2,<4",
    "plotly>=6,<7",
    "prometheus-client>=0.21,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "PyYAML>=6,<7",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=26,<40",
    "streamlit>=1.45,<2",
    "structlog>=24,<27",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=0.26,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-PyYAML>=6,<7",
]
seed = [
    "Faker>=37,<50",
]

[project.urls]
Repository = "https://github.com/cristianopsi/ai-sql-data-analyst"
Issues = "https://github.com/cristianopsi/ai-sql-data-analyst/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning", "error::FutureWarning"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["backend"]
