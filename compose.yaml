name: ai-sql-data-analyst

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_sql_data_analyst}
      POSTGRES_USER: ${POSTGRES_USER:-ai_sql_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - statement_timeout=30000
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - log_min_duration_statement=1000

    shm_size: 256mb
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ai-sql-data-analyst-backend:local
    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DATABASE_URL: "postgresql+psycopg://${APP_DATABASE_USER:?required}:${APP_DATABASE_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-ai_sql_data_analyst}"
      ANALYTICS_DATABASE_URL: "postgresql+psycopg://${ANALYTICS_DATABASE_USER:?required}:${ANALYTICS_DATABASE_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-ai_sql_data_analyst}"

    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ai-sql-data-analyst-frontend:local
    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      API_BASE_URL: http://backend:8000
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "8501"

    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
      - --browser.gatherUsageStats
      - "false"

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
    labels:
      com.ai-sql-data-analyst.description: PostgreSQL 18 persistent data
