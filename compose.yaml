name: ai-sql-data-analyst

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_sql_data_analyst}
      POSTGRES_USER: ${POSTGRES_USER:-ai_sql_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - statement_timeout=30000
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - log_min_duration_statement=1000

    shm_size: 256mb
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
    labels:
      com.ai-sql-data-analyst.description: PostgreSQL 18 persistent data
